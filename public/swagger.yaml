swagger: '2.0'
info:
  title: Swagger Argent Bank API documentation P-13
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    post:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Récupérer la liste des transactions
      description: API pour récupérer toutes les transactions de l'utilisateur connecté
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
        - in: query
          name: month
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: Filtrer par mois (YYYY-MM)
      produces:
        - application/json
      responses:
        '200':
          description: Liste de transactions récupérée avec succès
          schema:
            type: array
            items:
              $ref: '#/definitions/Transaction'
        '401':
          description: Non autorisé
        '500':
          description: Internal Server Error
  /user/transactions/{id}:
    put:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Modifier une transaction spécifique
      description: API pour modifier les champs food et notes d'une transaction par son ID
      parameters:
        - in: path
          name: id
          required: true
          type: string
          description: ID de la transaction à modifier
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
        - in: body
          name: body
          description: Champs à modifier (food et/ou notes)
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
      produces:
        - application/json
      responses:
        '200':
          description: Transaction modifiée avec succès
          schema:
            $ref: '#/definitions/Transaction'
        '400':
          description: Données invalides
        '401':
          description: Non autorisé
        '404':
          description: Transaction non trouvée
        '500':
          description: Internal Server Error
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      firstName:
        type: string
      lastName:
        type: string
  Transaction:
    type: object
    required: [id, date, label, amount, currency]
    properties:
      id:
        type: string
      date:
        type: string
        format: date-time
      label:
        type: string
      amount:
        type: number
      currency:
        type: string
        example: EUR
      food:
        type: string
        description: Catégorie alimentaire de la transaction
      notes:
        type: string
        description: Notes personnelles sur la transaction

  TransactionUpdate:
    type: object
    properties:
      food:
        type: string
        description: Nouvelle catégorie alimentaire
      notes:
        type: string
        description: Nouvelles notes personnelles
